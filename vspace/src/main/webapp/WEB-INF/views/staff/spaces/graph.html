<html layout:decorate="~{layouts/main_staff}">
    <head>
        <script th:inline="javascript">
            const jsonMap = [[${jsonFormatMap}]];
        </script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
        	:root {
        		--primary: #A55941;
        		--secondary: #F2A950;
        		--base-grey: #F2F2F2;
        		--med-grey: #C7C7C7;
        		--dark-grey: #8E8E8E;
        	}
        	
        	.graph-container {
        		display: flex;
        		gap: 20px;
        		align-items: flex-start;
        		flex-wrap: wrap;
        	}
        	
        	#graph {
        		flex: 1;
        		min-width: 600px;
        		background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        		border-radius: 12px;
        		box-shadow: 0px 4px 20px rgba(0,0,0,0.15);
        		position: relative;
        		overflow: hidden;
        	}
        	
        	#graph::before {
        		content: '';
        		position: absolute;
        		top: 0;
        		left: 0;
        		right: 0;
        		bottom: 0;
        		background: radial-gradient(circle at 30% 30%, rgba(242, 169, 80, 0.03), transparent 60%),
        		            radial-gradient(circle at 70% 70%, rgba(165, 89, 65, 0.03), transparent 60%);
        		pointer-events: none;
        	}
        	
        	#space-overview-card {
        		width: 22rem;
        		max-width: 100%;
        		box-shadow: 0px 4px 20px rgba(0,0,0,0.12);
        		border: none;
        		border-radius: 12px;
        		overflow: hidden;
        		transition: transform 0.3s ease, box-shadow 0.3s ease;
        	}
        	
        	#space-overview-card:hover {
        		transform: translateY(-2px);
        		box-shadow: 0px 8px 30px rgba(0,0,0,0.18);
        	}
        	
        	#space-overview-card-img {
        		border-bottom: 3px solid var(--primary);
        		transition: all 0.3s ease;
        	}
        	
        	#space-overview-card-body {
        		display: block !important;
        		padding: 1.5rem !important;
        		text-align: center;
        		background: linear-gradient(to bottom, #ffffff, #fafafa);
        	}
        	
        	#space-overview-card-title {
        		color: var(--primary);
        		font-weight: 700;
        		margin-bottom: 1rem;
        	}
        	
        	#space-overview-btn {
        		background: linear-gradient(135deg, var(--primary), #8E4A36) !important;
        		border: none !important;
        		padding: 0.6rem 1.5rem !important;
        		border-radius: 6px !important;
        		font-weight: 600 !important;
        		transition: all 0.3s ease !important;
        		box-shadow: 0 2px 8px rgba(165, 89, 65, 0.3);
        	}
        	
        	#space-overview-btn:hover {
        		background: linear-gradient(135deg, var(--secondary), #E09840) !important;
        		transform: translateY(-2px);
        		box-shadow: 0 4px 12px rgba(242, 169, 80, 0.4) !important;
        	}
        	
        	@keyframes fadeInUp {
        		from {
        			opacity: 0;
        			transform: translateY(20px);
        		}
        		to {
        			opacity: 1;
        			transform: translateY(0);
        		}
        	}
        	
        	.graph-container > * {
        		animation: fadeInUp 0.6s ease-out;
        	}
        	
        	.graph-container > *:nth-child(2) {
        		animation-delay: 0.2s;
        	}
        </style>
    </head>
    <body>
        <div layout:fragment="content">
        <div class="container">
        	<div class="graph-container">
	            <div id="graph" style="width: 100%; height: 600px;"></div>
	            <div class="card" id="space-overview-card">
				  <img src="../resources/maintenance/img/logo-11.png" class="card-img-top" id="space-overview-card-img" alt="Space/Module Image">
				  <div class="card-body" id="space-overview-card-body">
				    <h5 class="card-title" id="space-overview-card-title">Space Overview Map</h5>
				    <p class="card-text" id="space-overview-card-text">This is a map of all spaces and modules and their links with one another. Click or drag nodes to interact with them.</p>
				    <a href="#" class="btn btn-primary" id="space-overview-btn">Click a space or module node...</a>
				  </div>
				</div>
			</div>
            <script>
                var nodeJson = JSON.parse(jsonMap['nodesJson']);                
                const width = 928;
                const height = 600;

                const nodeArrays = categorizeNodes(nodeJson);
                const root = structureData(nodeArrays);            	
                const spaceLinks = getSpaceLinks(root.children);
                const links = root.links();
                spaceLinks.forEach(function (link) {
                	links.push(link);
                });
                const nodes = root.descendants();
                
                const simulation = d3.forceSimulation(nodes)
	                .force("link", d3.forceLink(links).id(d => d.data.id).distance(100).strength(1))
	                .force("charge", d3.forceManyBody().strength(-500))
	                .force("x", d3.forceX())
	                .force("y", d3.forceY());
                
                const svg = d3.select("#graph").append("svg")
                    .attr("width", width)
                    .attr("height", height)
                    .attr("viewBox", [-width / 2, -height / 2, width, height])
      				.attr("style", "max-width: 100%; height: auto;");
      				
      			// Define gradients and filters
      			const defs = svg.append("defs");
      			
      			// Gradient for space nodes (white center)
      			const spaceGradient = defs.append("radialGradient")
      				.attr("id", "spaceGradient");
      			spaceGradient.append("stop")
      				.attr("offset", "0%")
      				.attr("stop-color", "#ffffff");
      			spaceGradient.append("stop")
      				.attr("offset", "100%")
      				.attr("stop-color", "#f8f8f8");
      			
      			// Gradient for module nodes
      			const moduleGradient = defs.append("radialGradient")
      				.attr("id", "moduleGradient");
      			moduleGradient.append("stop")
      				.attr("offset", "0%")
      				.attr("stop-color", "#C47A5E");
      			moduleGradient.append("stop")
      				.attr("offset", "100%")
      				.attr("stop-color", "#A55941");
      			
      			// Selected node gradient
      			const selectedGradient = defs.append("radialGradient")
      				.attr("id", "selectedGradient");
      			selectedGradient.append("stop")
      				.attr("offset", "0%")
      				.attr("stop-color", "#FFD699");
      			selectedGradient.append("stop")
      				.attr("offset", "100%")
      				.attr("stop-color", "#F2A950");
      			
      			// Drop shadow filter
      			const filter = defs.append("filter")
      				.attr("id", "dropShadow")
      				.attr("height", "150%")
      				.attr("width", "150%");
      			filter.append("feGaussianBlur")
      				.attr("in", "SourceAlpha")
      				.attr("stdDeviation", 3);
      			filter.append("feOffset")
      				.attr("dx", 0)
      				.attr("dy", 2)
      				.attr("result", "offsetblur");
      			filter.append("feComponentTransfer")
      				.append("feFuncA")
      				.attr("type", "linear")
      				.attr("slope", 0.3);
      			const feMerge = filter.append("feMerge");
      			feMerge.append("feMergeNode");
      			feMerge.append("feMergeNode")
      				.attr("in", "SourceGraphic");
      			
      			// Glow filter for hover
      			const glowFilter = defs.append("filter")
      				.attr("id", "glow");
      			glowFilter.append("feGaussianBlur")
      				.attr("stdDeviation", "4")
      				.attr("result", "coloredBlur");
      			const glowMerge = glowFilter.append("feMerge");
      			glowMerge.append("feMergeNode")
      				.attr("in", "coloredBlur");
      			glowMerge.append("feMergeNode")
      				.attr("in", "SourceGraphic");
                
                // Create straight links
                const link = svg.append("g")
                    .attr("stroke", "#8E8E8E")
                    .attr("stroke-opacity", 0.4)
                  .selectAll("line")
                  .data(links)
                  .join("line")
                  .attr("stroke-width", 2);
                
                drag = simulation => {
  	          	  
  	          	  function dragstarted(event, d) {
  	          	    if (!event.active) simulation.alphaTarget(0.3).restart();
  	          	    d.fx = d.x;
  	          	    d.fy = d.y;
  	          	  }
  	          	  
  	          	  function dragged(event, d) {
  	          	    d.fx = event.x;
  	          	    d.fy = event.y;
  	          	  }
  	          	  
  	          	  function dragended(event, d) {
  	          	    if (!event.active) simulation.alphaTarget(0);
  	          	    // Keep nodes fixed in place after dragging
  	          	    // d.fx and d.fy remain set, so node stays where dropped
  	          	  }
  	          	  
  	          	  return d3.drag()
  	          	      .on("start", dragstarted)
  	          	      .on("drag", dragged)
  	          	      .on("end", dragended);
  	         	}
                
                const node = svg.append("g")
				    .attr("stroke-width", 1.5)
                  .selectAll("circle")
			      .data(nodes)
			      .join("circle")
			      .style("opacity", 0)
				    .call(drag(simulation));
				
				// Fade in animation
				node.transition()
					.duration(800)
					.delay((d, i) => i * 50)
					.style("opacity", function(d) { return d.depth === 0 ? 0 : 1; })
	             		
           	    const text = svg.append("g")
                  .selectAll("text")
                  .data(nodes)
                  .enter().append("text")
                  .text(d => d.data.name)
                  .attr("x", d => d.x)
                  .attr("y", d => d.y)
                  .attr("text-anchor", "middle")
                  .style("font-size", "12px")
                  .style("font-weight", 900)
                  .style("opacity", 0);
                  
                // Fade in text
                text.transition()
                	.duration(800)
                	.delay((d, i) => i * 50 + 200)
                	.style("opacity", function(d) { return d.depth === 0 ? 0 : 1; });
           	    
	           	// Hide root node and set pointer events
	           	node.style("pointer-events", function(d) { return d.depth === 0 ? "none" : "all"; })
	           	// Make module nodes smaller and style with gradients
	           		.style("r", function(d) { return d.depth === 2 ? 22 : d.depth === 1 ? 32 : 0; })
	           		.style("fill", function(d) { 
	           			return d.depth === 1 ? "url(#spaceGradient)" : "url(#moduleGradient)"; 
	           		})
	           		.style("stroke", function(d) { return d.depth === 1 ? "#A55941" : "#8E8E8E"; })
	           		.style("stroke-width", function(d) { return d.depth === 1 ? 3 : 2; })
	           		.style("filter", "url(#dropShadow)")
	           		
		           	.on("mouseover", function(event, d) {
					    d3.select(this)
					      .style("cursor", "pointer")
					      .style("stroke-width", 5)
					      .style("filter", "url(#glow)");
					})
					.on("mouseout", function(event, d) {
					    d3.select(this)
					      .style("cursor", "default")
					      .style("stroke-width", function(d) { return d.depth === 1 ? 3 : 2; })
					      .style("filter", "url(#dropShadow)");
					})
	            	.on('click', function(event, d) {
	            		//Reset highlighting
	            		d3.selectAll("circle")
							.style("fill", function(d) { 
								return d.depth === 1 ? "url(#spaceGradient)" : "url(#moduleGradient)"; 
							})
							.style("stroke", function(d) { return d.depth === 1 ? "#A55941" : "#8E8E8E"; })
							.style("stroke-width", function(d) { return d.depth === 1 ? 3 : 2; });
	            		
	            		//Update card for node clicked
	            		if (d.data.img) {
		            		document.getElementById("space-overview-card-img").src = d.data.img;
		            		document.getElementById("space-overview-card-img").style.display = "block";
	            		} else {
	            			document.getElementById("space-overview-card-img").src = "../resources/maintenance/img/logo-11.png";
	            			document.getElementById("space-overview-card-img").style.display = "block";
	            		}
	           			if (d.data.link) {
	           				document.getElementById("space-overview-btn").href = d.data.link;
	           				document.getElementById("space-overview-btn").style.display = "inline-block";
	            		} else {
	            			document.getElementById("space-overview-btn").style.display = "none";
	            		}
	           			document.getElementById("space-overview-btn").innerHTML = "Go to " + d.data.name;
	           			document.getElementById("space-overview-card-title").innerHTML = d.data.name;
	           			document.getElementById("space-overview-card-text").innerHTML = d.data.description;
	           			
	           			// Highlight selected node with gradient
	           			d3.selectAll("circle").filter(function(n) {
	                    	return n.data.id == d.data.id;
	                  	}).style("fill", "url(#selectedGradient)")
	                  	  .style("stroke", "#A55941")
	                  	  .style("stroke-width", 4);
	            	});
	           	
	           	text.style("fill", function(d) { return d.depth === 1 ? "#121212" : "#fff"; })
	           		.style("font-weight", "600")
	           		.style("pointer-events", "none")
	           		.style("text-shadow", "0 1px 2px rgba(0,0,0,0.2)")
	           		.style("user-select", "none");
	           	
           	 	d3.selectAll("line").filter(function(d) {
                	return d.source.depth === 0;
              	}).style("visibility", "hidden")
              	  .style("opacity", 0)
           	 	  .style("pointer-events", "none");
           	 	  
	            simulation.on("tick", () => {
	              // Draw straight links
	              link
	                  .attr("x1", d => d.source.x)
	                  .attr("y1", d => d.source.y)
	                  .attr("x2", d => d.target.x)
	                  .attr("y2", d => d.target.y);

	              node
	                  .attr("cx", d => d.x)
	                  .attr("cy", d => d.y);
	              
	              text
		              .attr("x", d => d.x)
		              .attr("y", d => d.y);
	            });
             
                function structureData(nodeArrays) {
                	var map = {};
                	map.children = [];

                	function createHierarchy(spaces, modules) {
                		spaces.forEach(function (space) {
                			if (space.edges.length > 0) {
                				space.edges.forEach(function (edge) {
                    				childModule = modules.find(item => item.id === edge);
                    				if (childModule) {
                    					space.children.push(childModule);
                    				}
                    			});	
                			}
                			map.children.push(space);
                		});
                	}
                	                	
                	createHierarchy(nodeArrays.spaces, nodeArrays.modules);         	
                	return d3.hierarchy(map);
                }
                
                function categorizeNodes(nodes) {
            		spaces = [];
            		modules = [];
            		nodes.forEach(function (node) {
                		if (!node.module) {
                			// Only spaces have children
                			node.children = [];
                			spaces.push(node);
                		} else {
                			modules.push(node);
                		}
                	});
            		return {"spaces": spaces, "modules": modules};
            	}
                
                // Links between spaces need to be created manually because tree hierarchy only generates links with children
                function getSpaceLinks(spaces) {
                	spaceLinkList = [];
                	spaces.forEach(function (space) {
            			if (space.data.edges.length > 0) {
            				space.data.edges.forEach(function (edge) {
                				spaceTarget = spaces.find(item => item.data.id === edge);
                				if (spaceTarget) {
                					spaceLinkList.push({
                						source: space,
                						target: spaceTarget
                					});
                				}
                			});	
            			}
            		});
                	return spaceLinkList;
                }
            </script>
        </div>
        </div>
    </body>
</html>
