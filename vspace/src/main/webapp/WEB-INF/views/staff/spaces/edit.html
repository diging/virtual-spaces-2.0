<html layout:decorate="~{layouts/main_staff}">
<head>
<title>Edit Space</title>

<link th:href="@{/resources/extra/localizedFields.css}" type="text/css" rel="stylesheet">
<script th:src="@{/resources/extra/editElement.js}"></script>

</head>
<body>
	<div class="main-content" layout:fragment="content">
		<h1>Edit Space: [(${spaceForm.name})]</h1>

		<form method="POST"
			th:action='@{|/staff/space/${spaceId}/edit?${_csrf.parameterName}=${_csrf.token}|}' th:object="${spaceForm}"
			enctype="multipart/form-data" style="margin-top: 40px">
			
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			
			<div th:replace="~{staff/fragments/localizedFields :: localizedFields('space', 'Space Name:', 'Description:', ${spaceForm.defaultName}, ${spaceForm.defaultDescription}, 'defaultName', 'defaultDescription', ${spaceForm.names}, ${spaceForm.descriptions}, 'names', 'descriptions')}"></div>
				
			
			
			<p style="padding-top: 20px;">
				<button class="btn primary-btn" type="submit" value="submit">Save Space</button>
				<a th:href="@{|/staff/space/${spaceId}|}" class="btn btn-light">Cancel</a>
			</p>
		</form>
	</div>
</body>
</html>
