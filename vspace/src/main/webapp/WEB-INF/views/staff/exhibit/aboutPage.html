
<html layout:decorate="~{layouts/main_staff}">
<head>
<link rel="stylesheet"
	href="https://unpkg.com/easymde/dist/easymde.min.css">
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<link th:href="@{/resources/extra/localizedFields.css}" type="text/css" rel="stylesheet">
<script th:src="@{/resources/extra/editElement.js}"></script>

<style type="text/css">
.EasyMDEContainer .CodeMirror-wrap{
    overflow-y: scroll;
    height: 400px;
}

</style>


</head>

<body>
	<div layout:fragment="content" class="main-content">
		<h2>Exhibition About Page</h2>
		<div style="padding: 30px 0;">
			<form		method="POST" 			
			name="f" >
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				
				
				<div th:replace="~{staff/fragments/localizedFields :: localizedFields('about', 'About Page Title:', 'About Page Text:', ${aboutPage.defaultTitle}, ${aboutPage.defaultAboutPageText}, 'defaultTitle', 'defaultAboutPageText', ${aboutPage.titles}, ${aboutPage.aboutPageTexts}, 'titles', 'aboutPageTexts')}"></div>
				<p style="padding-top: 20px;">
					<button th:formaction="@{/staff/exhibit/about?}" class="btn primary-btn" type="submit" value="submit">Submit</button>
				</p>
	
		
			</form>
		</div>
	</div>
</body>
</html>
