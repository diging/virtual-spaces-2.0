
<html layout:decorate="~{layouts/main_staff}">
<head>
<link rel="stylesheet"
	href="https://unpkg.com/easymde/dist/easymde.min.css">
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script th:src="@{'/resources/extra/editElement.js'}"></script>

<link th:href="@{/resources/extra/localizedText.css}" type="text/css" rel="stylesheet">
<script th:inline="javascript">
	$(document).ready(function() {
		$(".EasyMDEContainer").remove();
		$('.tabcontent textarea').each(function() {
			$(this).data('easymde', new EasyMDE({ element: this }));
		});
	});
	
</script>
</head>

<body>
	<div layout:fragment="content" class="main-content">
		<h2>Exhibition About Page</h2>
		<div style="padding: 30px 0;">
			<form		method="POST" 			
			name="f" >
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				
				
				<div th:replace="~{staff/fragments/localizedText :: localizedFields(${aboutPage.defaultTitle}, ${aboutPage.defaultAboutPageText}, ${aboutPage.titles}, ${aboutPage.aboutPageTexts}, 'defaultTitle', 'defaultAboutPageText', 'titles', 'aboutPageTexts', 'About Page Title:', 'About Page Text:', 'aboutPage')}"></div>
				<p style="padding-top: 20px;">
					<button th:formaction="@{/staff/exhibit/about?}" class="btn primary-btn" type="submit" value="submit">Submit</button>
				</p>
	
		
			</form>
		</div>
	</div>
</body>
</html>
